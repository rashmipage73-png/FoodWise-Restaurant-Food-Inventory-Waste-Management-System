<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FoodWise ERP</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<aside class="sidebar"><a class="brand" href="{{ url_for('home') }}"><span class="brand-icon">♧</span><span class="brand-name">FoodWise<small>ERP</small></span></a><nav class="nav">
<a class="{{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">▦ &nbsp; Dashboard</a><a class="{{ 'active' if request.endpoint in ['inventory','edit_inventory','delete_inventory'] else '' }}" href="{{ url_for('inventory') }}">⬡ &nbsp; Inventory</a><a class="{{ 'active' if request.endpoint == 'food_waste' else '' }}" href="{{ url_for('food_waste') }}">♲ &nbsp; Food Waste</a><a class="{{ 'active' if request.endpoint in ['suppliers','delete_supplier'] else '' }}" href="{{ url_for('suppliers') }}">♧ &nbsp; Suppliers</a><a class="{{ 'active' if request.endpoint in ['orders','receive_order','delete_order'] else '' }}" href="{{ url_for('orders') }}">🛒 &nbsp; Purchase Orders</a></nav><div class="sidebar-foot">Manage food smarter.<br>Waste less.</div></aside>
<main class="main">{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ 'error' if category == 'error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
